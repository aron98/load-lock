name: Publish to npm

# Publishes to npm when a GitHub Release is published, using npm Trusted
# Publishing (OIDC; no tokens in secrets). Provenance is signed and
# attached automatically.
#
# Bootstrap (DONE, verified 2026-10-15):
#   1. v0.1.0 was published manually (npm has no pending-publisher flow
#      for new packages, see npm/documentation#1926).
#   2. Trusted publisher configured on npmjs.com for this workflow
#      (environment "npm", allowed action: npm publish).
#   3. v0.1.1 published via this workflow — OIDC + provenance verified.
#   4. Remaining hardening (npmjs.com → package Settings → Publishing
#      access): "Require two-factor authentication and disallow tokens".
#
# NOTE: the GitHub environment "npm" restricts deployment by ref. Tag
# refs need a *tag*-type deployment policy (POST
# /repos/{owner}/{repo}/environments/npm/deployment-branch-policies
# with name "v*", type "tag"); a branch-type "v*" policy alone rejects
# release builds.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm  # must match the npm Trusted Publisher environment field
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24          # OIDC needs npm >= 11.5.1 (bundled with Node 24)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false  # never use caching in release builds
      - run: npm ci
      - run: npm run build
      # NODE_AUTH_TOKEN must be cleared: setup-node otherwise writes a
      # default (GitHub) token into .npmrc that breaks OIDC auth
      # (see actions/setup-node#1440).
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ""
