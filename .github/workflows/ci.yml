name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Test (daemon, MCP, hooks, run helpers)
        run: node --test dist/test/*.test.js

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Version pins match package.json (fix with npm run check-pins -- --write)
        run: node scripts/check-pins.mjs

  install-from-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Pack and install globally
        run: |
          npm pack
          # npm-shrinkwrap.json (issue #103) is generated by the prepack script;
          # fail if it is missing from the tarball or stale vs package-lock.json.
          node scripts/shrinkwrap.mjs --check ./*.tgz
          npm install -g ./*.tgz
          # devDependencies must never reach a user's install. (npm ignores a
          # local tarball's shrinkwrap; --check above asserts the shipped one
          # lists no dev-only packages, which covers registry installs.)
          root="$(npm root -g)/@aron98/load-lock/node_modules"
          for dev in typescript solid-js @opentui/core @opentui/solid @opencode/theme; do
            if [ -e "$root/$dev" ]; then echo "devDependency $dev installed from tarball"; exit 1; fi
          done
      - name: Smoke test installed CLI
        env:
          LOAD_LOCK_STATE_DIR: ${{ runner.temp }}/ll-smoke
        run: |
          mkdir -p "$LOAD_LOCK_STATE_DIR"
          load-lock doctor
          load-lock status
          load-lock agent-guide > /dev/null && echo "agent-guide ok"
          load-lock service stop
