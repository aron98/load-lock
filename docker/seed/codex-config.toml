# Seed config for Codex CLI inside the verification container.
# The load-lock installer appends its MCP server table to this file.
#
# llm-gateway is an OpenAI-compatible gateway that also exposes the
# Responses API (/v1/responses). Codex no longer supports wire_api "chat";
# the key arrives via LLM_GATEWAY_API_KEY (docker run --env-file).
model = "gateway-model"
model_provider = "llm-gateway"

# Non-interactive verification run: never ask for approvals, allow shell
# + MCP tools (disposable container, --init, no host mounts).
approval_policy = "never"
sandbox_mode = "danger-full-access"

[model_providers.llm-gateway]
name = "LLM Gateway"
base_url = "https://llm-gateway.example.invalid/v1"
env_key = "LLM_GATEWAY_API_KEY"
wire_api = "responses"
