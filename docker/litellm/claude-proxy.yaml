# LiteLLM translation sidecar for Claude Code live verification.
#
# Claude Code only speaks the Anthropic /v1/messages protocol; the
# llm-gateway gateway (https://llm-gateway.example.invalid/v1) is OpenAI-compatible
# only. LiteLLM's proxy exposes an Anthropic-format /v1/messages endpoint and
# translates to OpenAI chat-completions for the configured backend model.
#
# Claude Code in the verification container is pointed at this proxy via:
#   ANTHROPIC_BASE_URL=http://litellm:4000
#   ANTHROPIC_AUTH_TOKEN=sk-load-lock-verify (must equal LITELLM_MASTER_KEY)
#   ANTHROPIC_MODEL=claude-sonnet-4-5          (mapped below)
#   ANTHROPIC_SMALL_FAST_MODEL=claude-haiku-4-5 (mapped below)
#
# The upstream key arrives via LLM_GATEWAY_API_KEY (docker/.env, gitignored)
# and is NEVER written into this file.
model_list:
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/gateway-model
      api_base: https://llm-gateway.example.invalid/v1
      api_key: os.environ/LLM_GATEWAY_API_KEY
  # Claude Code makes a few auxiliary model calls (titles, etc.) unless
  # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC is set; keep the small-model
  # alias on the same backend so nothing 404s.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gateway-model
      api_base: https://llm-gateway.example.invalid/v1
      api_key: os.environ/LLM_GATEWAY_API_KEY

litellm_settings:
  # Claude Code sends Anthropic-specific params (metadata, system blocks,
  # cache_control, ...). Drop what the OpenAI-compatible backend rejects.
  drop_params: true
  num_retries: 2
  request_timeout: 600

general_settings:
  # Recent litellm builds refuse to start without a master key. The key is a
  # throwaway value local to the compose network (LITELLM_MASTER_KEY in
  # compose-claude-verify.yml); the claude container sends it as
  # ANTHROPIC_AUTH_TOKEN. The only real credential is LLM_GATEWAY_API_KEY,
  # which is held by the proxy itself and never exposed to the claude container.
  master_key: os.environ/LITELLM_MASTER_KEY
